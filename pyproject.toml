[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itkb"
version = "0.1.0"
description = "Local LLM IT Knowledge Base"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "markdownify>=0.12",
    "httpx>=0.27",
    "sqlite-vec>=0.1",
    "ollama>=0.3",
    "pysqlite3>=0.5",
    "tomli>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.0",
    "tomli-w>=1.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.0"]

[project.scripts]
kb = "itkb.cli:app"

[tool.setuptools.packages.find]
include = ["itkb*"]
