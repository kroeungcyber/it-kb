x-api-common: &api-common
  build: .
  ports:
    - "8000:8000"
  volumes:
    - itkb-data:/root/.itkb
    - ./samples:/samples:ro
    - ./PROGRAM.md:/app/PROGRAM.md:ro
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
    interval: 10s
    timeout: 3s
    retries: 12

services:
  # Default: API only, talks to the host's Ollama (GPU on this Mac).
  api:
    <<: *api-common
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Bundled demo: API wired to the compose Ollama service + small models.
  api-demo:
    <<: *api-common
    profiles: ["bundled"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      ITKB_MODEL: llama3.2:3b
      ITKB_EMBED_MODEL: nomic-embed-text
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  ollama:
    profiles: ["bundled"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

  ollama-init:
    profiles: ["bundled"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: sh -c "ollama pull llama3.2:3b && ollama pull nomic-embed-text"

  # Optional: pre-load samples/ into the KB (use together with bundled).
  ingest-samples:
    profiles: ["demo-data"]
    build: .
    restart: "no"
    volumes:
      - itkb-data:/root/.itkb
      - ./samples:/samples:ro
      - ./PROGRAM.md:/app/PROGRAM.md:ro
    environment:
      OLLAMA_HOST: http://ollama:11434
      ITKB_EMBED_MODEL: nomic-embed-text
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    command: ["kb", "ingest", "/samples"]

volumes:
  itkb-data:
  ollama-models:
