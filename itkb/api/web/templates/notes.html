<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>itkb — Notes</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .notes-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .note-card { background: #161924; border: 1px solid #2d3148; border-radius: 8px; padding: 1rem; }
    .note-body { color: #e2e8f0; font-size: 0.95rem; line-height: 1.6; margin-bottom: 0.5rem; }
    .note-meta { display: flex; gap: 2rem; font-size: 0.8rem; color: #64748b; }
    .note-linked { color: #a5b4fc; }
    .note-unlinked { color: #4b5563; font-style: italic; }
    .note-id { font-family: monospace; color: #4b5563; }
  </style>
</head>
<body>
<nav>
  <a href="/">Chat</a>
  <a href="/docs-ui">Documents</a>
  <a href="/history">History</a>
  <a href="/notes" class="active">Notes</a>
</nav>
<div class="container">
  <h2 style="margin: 1rem 0; color: #94a3b8;">Incident Notes</h2>
  <p style="color:#64748b;font-size:0.9rem;margin-bottom:0.5rem;">
    Notes auto-link to the most recent query. Run <code>kb note "text"</code> to add one.
  </p>
  <div class="notes-list" id="notes-list">
    <p style="color:#64748b;">Loading…</p>
  </div>
</div>
<script>
"use strict";
const notesList = document.getElementById("notes-list");

fetch("/api/notes").then(r => r.json()).then(notes => {
  notesList.textContent = "";
  if (!notes.length) {
    notesList.innerHTML = '<p style="color:#64748b;">No notes yet. Run <code>kb note "text"</code> to record one.</p>';
    return;
  }
  notes.forEach(n => {
    const card = document.createElement("div");
    card.className = "note-card";

    const body = document.createElement("div");
    body.className = "note-body";
    body.textContent = n.body;
    card.appendChild(body);

    const meta = document.createElement("div");
    meta.className = "note-meta";

    const linked = document.createElement("span");
    if (n.linked_question) {
      linked.className = "note-linked";
      linked.textContent = "Q: " + n.linked_question;
    } else {
      linked.className = "note-unlinked";
      linked.textContent = "(no linked query)";
    }
    meta.appendChild(linked);

    const time = document.createElement("span");
    time.textContent = n.created_at.slice(0, 19).replace("T", " ");
    meta.appendChild(time);

    const idSpan = document.createElement("span");
    idSpan.className = "note-id";
    idSpan.textContent = "#" + n.id;
    meta.appendChild(idSpan);

    card.appendChild(meta);
    notesList.appendChild(card);
  });
});
</script>
</body>
</html>
